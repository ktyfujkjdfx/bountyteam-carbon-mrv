name: Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".nvmrc"
      # Inputs of the frontend gate: generated API types and fixture adapter read these frozen files.
      - "contracts/openapi.yaml"
      - "contracts/api-models.schema.json"
      - "fixtures/**"
      - "config/demo-authorizations.json"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: frontend verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Frontend gate (check:api, lint, typecheck, test, build, check:dist)
        run: npm run verify

      - name: Verify generated and frozen files are unchanged
        working-directory: .
        run: git diff --exit-code -- frontend/src/api/generated contracts fixtures config
