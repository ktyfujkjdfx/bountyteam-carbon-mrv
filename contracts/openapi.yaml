    Job:
      type: object
      properties:
        job_id: *id002
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        verification_id:
          anyOf:
          - *id002
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
      required:
      - job_id
